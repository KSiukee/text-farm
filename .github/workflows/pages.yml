# 网页版：编 wasm 内核 → 构建前端 → 发布到 GitHub Pages
#
# ★ 只在打 tag 时部署：push 到 main **不会**动正式站。
#   理由：正式站有真人在玩，随手 push 一个还没测透的改动，他们一刷新就撞上。
#   平时改完先本地 `npm run preview -- --host` 用手机验，验过了再打 tag。
#
# 前置：仓库 Settings → Pages → Source 选「GitHub Actions」。
# 没开的话 build 能过、deploy 这一步会 404。
# 站点地址：https://<用户名>.github.io/<仓库名>/
# 如果以后绑自定义域名，把下面的 PAGES_BASE 改成 "/"。

name: 网页版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: 编 wasm 内核
        run: |
          cargo build -p farm-wasm --target wasm32-unknown-unknown --release
          mkdir -p app/frontend/public
          cp target/wasm32-unknown-unknown/release/farm_wasm.wasm app/frontend/public/farm_wasm.wasm

      - name: 构建前端
        working-directory: app/frontend
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
