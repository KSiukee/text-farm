# 桌面版：打 Windows exe，挂到 GitHub Release
#
# 用法：git tag v0.139.0 && git push --tags
# 产物：Release 里的「文字农场.exe」（免安装，双击就跑）
#
# 注意：exe 没有代码签名证书，首次运行 Windows 会提示「已保护你的电脑」，
# 玩家需要点「更多信息 → 仍要运行」。README 里已写明。

name: 桌面版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发布闸门：tag 推上来先过机器检查，不过就一个产物都不出。
  # （本地 .githooks/pre-push 是第一道；这里是不依赖本机配置的第二道。）
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 发布前闸门
        run: python3 scripts/release-check.py --ci

  windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows

      - name: 装前端依赖
        working-directory: app/frontend
        run: npm ci

      - name: 装 tauri cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: 构建 exe
        run: cargo tauri build --no-bundle

      - name: 改名
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $ver = (Get-Content "app/tauri.conf.json" -Raw | ConvertFrom-Json).version
          # 文件名用 ASCII：中文文件名在 release 附件里会被处理成 default.exe
          Copy-Item "target/release/text-farm.exe" "out/text-farm-$ver-win64.exe"
          Get-Item "out/text-farm-$ver-win64.exe" | Select-Object Name, Length

      - name: 生成更新说明
        run: python scripts/release-notes.py --out release-notes.md

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 文字农场 ${{ github.ref_name }}
          files: out/*.exe
          body_path: release-notes.md
          draft: true

            **macOS**：下载 `text-farm-*-macos-universal.dmg`（Intel / Apple 芯片通用）。
            没买 Apple 开发者账号、没做公证，首次打开会被拦：
            右键 →「打开」，或者终端跑一句
            `xattr -dr com.apple.quarantine /Applications/文字农场.app`。

            **网页版**（不用下载）：https://ksiukee.github.io/text-farm/

            存档三端通用，设置里可以导出/导入。有问题请开 Issue。

  macos:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 通用二进制：Intel + Apple 芯片一个包
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos

      - name: 装前端依赖
        working-directory: app/frontend
        run: npm ci

      - name: 装 tauri cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: 构建 dmg
        # tauri.conf 里的 bundle.targets 是 ["nsis"]（Windows 专用），
        # macOS 必须用 --bundles 覆盖，否则出不了包。
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 改名
        run: |
          mkdir -p out
          ver=$(node -p "require('./app/tauri.conf.json').version")
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/text-farm-$ver-macos-universal.dmg"
          ls -lh out

      - name: 生成更新说明
        run: python3 scripts/release-notes.py --out release-notes.md

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 文字农场 ${{ github.ref_name }}
          files: out/*.dmg
          body_path: release-notes.md
          draft: true

            **macOS**：下载 `text-farm-*-macos-universal.dmg`（Intel / Apple 芯片通用）。
            没买 Apple 开发者账号、没做公证，首次打开会被拦：
            右键 →「打开」，或者终端跑一句
            `xattr -dr com.apple.quarantine /Applications/文字农场.app`。

            **网页版**（不用下载）：https://ksiukee.github.io/text-farm/

            存档三端通用，设置里可以导出/导入。有问题请开 Issue。
